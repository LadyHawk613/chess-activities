<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Trap Simulator: Spot the Blunder</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery (Required by chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Chessboard.js CSS and JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <style>
        .highlight-correct { box-shadow: inset 0 0 3px 3px #4ade80; }
        .highlight-incorrect { box-shadow: inset 0 0 3px 3px #f87171; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 p-2 flex flex-col items-center justify-center h-screen overflow-hidden">

    <div class="max-w-xl w-full bg-slate-800 p-4 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-lg font-bold text-sky-400">Opening Trap Simulator</h1>
                <p id="scenarioTitle" class="text-xs text-slate-400">Halloween Gambit Scenario</p>
            </div>
            <div class="flex gap-2">
                <button id="nextMoveBtn" class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-semibold px-2.5 py-1.5 rounded-lg transition text-xs">
                    Next Move ➔
                </button>
                <button id="resetBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-2.5 py-1.5 rounded-lg transition text-xs">
                    Reset
                </button>
            </div>
        </div>

        <!-- Status / Instruction Box -->
        <div id="instructionBox" class="mb-3 bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-center transition-all">
            <span id="statusText" class="font-bold text-xs text-slate-200">Click 'Next Move' to walk through the opening.</span>
        </div>

        <!-- Board Container -->
        <div class="flex justify-center mb-3">
            <div id="board" style="width: 360px"></div>
        </div>

        <!-- Move list display -->
        <div class="bg-slate-900 p-2 rounded-lg text-xs text-slate-400 font-mono h-12 overflow-y-auto border border-slate-700" id="moveList">
            <span class="text-slate-500">Moves: </span> 
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        var board = null;
        var game = new Chess();
        
        const setupMoves = ['e4', 'e5', 'Nf3', 'Nc6', 'Nc3', 'Nf6', 'Nxe5']; 
        const blunderMove = 'Nxe4?'; 
        const refutationMove = 'd4';
        
        let setupIndex = 0;
        let currentState = 'stepping'; // 'stepping', 'awaiting_refutation', 'completed'

        function updateStatus(msg, type = 'default') {
            const box = $('#instructionBox');
            const text = $('#statusText');
            text.text(msg);
            box.removeClass('border-slate-700 border-green-500 border-red-500 bg-slate-900 bg-green-900/30 bg-red-900/30');

            if (type === 'error') box.addClass('border-red-500 bg-red-900/30 text-red-200');
            else if (type === 'success') box.addClass('border-green-500 bg-green-900/30 text-green-200');
            else box.addClass('border-slate-700 bg-slate-900 text-slate-200');
        }

        function updateMoveList(move) {
            $('#moveList').append(move + ' ');
            $('#moveList').scrollTop($('#moveList')[0].scrollHeight);
        }

        function handleNextMoveClick() {
            if (currentState === 'stepping') {
                if (setupIndex < setupMoves.length) {
                    let move = setupMoves[setupIndex];
                    game.move(move);
                    board.position(game.fen());
                    updateMoveList(move);
                    setupIndex++;
                    updateStatus(`Move ${setupIndex}/${setupMoves.length + 1}: Opening development.`);
                } else if (setupIndex === setupMoves.length) {
                    // Play the Blunder step
                    game.move(blunderMove);
                    board.position(game.fen());
                    updateMoveList(blunderMove);
                    setupIndex++;
                    
                    // Switch phase to interactive refutation challenge
                    currentState = 'awaiting_refutation';
                    updateStatus("Black just played Nxe4 (Blunder!). Drag White's piece to punish this mistake.");
                    $('#nextMoveBtn').text('Locked').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
                }
            }
        }

        function onDrop(source, target) {
            if (currentState !== 'awaiting_refutation') return 'snapback';

            $('#board .square-55d63').removeClass('highlight-correct highlight-incorrect');

            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';
            board.position(game.fen());

            if (move.san === refutationMove) {
                currentState = 'completed';
                $(`.square-${source}`).addClass('highlight-correct');
                $(`.square-${target}`).addClass('highlight-correct');
                updateStatus("Correct! White gains a decisive advantage after d4. 🎉", 'success');
            } else {
                $(`.square-${source}`).addClass('highlight-incorrect');
                $(`.square-${target}`).addClass('highlight-incorrect');
                updateStatus("Incorrect. That doesn't exploit the blunder. Try again.", 'error');
                
                window.setTimeout(function() {
                    game.undo();
                    board.position(game.fen());
                    if (currentState === 'awaiting_refutation') {
                         updateStatus("Punish Black's mistake (Nxe4) with White.");
                    }
                }, 800);
            }
        }

        var config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: onDrop,
            snapbackSpeed: 500,
            snapSpeed: 100,
        };

        board = Chessboard('board', config);
        $(window).resize(board.resize);

        // Event Handlers
        $('#nextMoveBtn').on('click', handleNextMoveClick);

        $('#resetBtn').on('click', function() {
            game.reset();
            board.position('start');
            setupIndex = 0;
            currentState = 'stepping';
            $('#moveList').html('<span class="text-slate-500">Moves: </span>');
            $('#nextMoveBtn').text('Next Move ➔').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
            updateStatus("Click 'Next Move' to walk through the opening.");
        });

        updateStatus("Click 'Next Move' to walk through the opening.");
    </script>
</body>
</html>
